name: litetavern
description: "轻酒馆 — 简洁的 AI 角色扮演聊天 App"
publish_to: 'none'

version: 0.10.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  file_picker: ^8.0.0
  archive: ^3.6.0
  flutter_markdown: ^0.7.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  adaptive_icon_foreground: assets/icon/icon.png
  adaptive_icon_background: "#E4E1EE"
  android: true

flutter:
  uses-material-design: true
